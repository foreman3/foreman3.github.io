<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Connect to play | VibeCade</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px; background: #0b1020; color: #f8fafc; font: 18px/1.6 system-ui, sans-serif; }
    main { max-width: 420px; }
    h1 { color: #66f2d6; line-height: 1.2; }
    p { color: #b9c2d0; }
    button, a { display: inline-block; margin: 6px 12px 6px 0; padding: 12px 18px; border: 1px solid #66f2d6; border-radius: 10px; background: #152c37; color: #f8fafc; font: inherit; text-decoration: none; cursor: pointer; }
    :focus-visible { outline: 3px solid #fca311; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>This page isn’t saved yet</h1>
    <p>Return to the arcade to play downloaded games. To finish saving the collection, reconnect and keep the arcade open until it says the games are ready offline.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <a id="arcade-link" href="./">Back to arcade</a>
  </main>
  <script>
    // Offline HTML may be served at a game's URL. Use the registration's scope
    // to return to the arcade even when it is hosted in a subdirectory.
    navigator.serviceWorker?.getRegistration().then(registration => {
      if (registration) document.getElementById('arcade-link').href = registration.scope;
    }).catch(() => {});
  </script>
</body>
</html>
